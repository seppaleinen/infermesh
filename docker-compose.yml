# InferMesh — local / homelab inference pool via Docker Compose.
#
# Works out of the box with pre-built images:
#   docker compose up -d
#
# Build from source (no pre-built image needed):
#   docker compose --build up -d
#
# GPU workers: add `--profile gpu` to start the worker with the NVIDIA runtime.
# Relay:       add `--profile relay` to start the relay broker for outbound-only
#               workers that can't accept inbound connections.
#
# Override flags at runtime via ROUTER_ARGS / WORKER_ARGS / RELAY_ARGS (the
# images' CMD runs the binary with $ROUTER_ARGS / $WORKER_ARGS / $RELAY_ARGS).
# See the commented production example below for mTLS.

services:
  router:
    image: ghcr.io/seppaleinen/infermesh/router:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: router
    container_name: infermesh-router
    ports:
      - "8081:8081"
    command:
      # Router flags. Default: dev mode (no auth, loopback only).
      # --addr :8081 sets the listen port; workers register to that port.
      # The image is ENTRYPOINT-ONLY, so args go here (or via `docker run ...`).
      - "--dev-mode"
      - "--addr"
      - ":8081"
      - "--api-key"
      - "heybaby"
      - "--proxy-timeout"
      - "120s"
      - "--model-load-timeout"
      - "120s"
    environment:
      # The worker resolves its router URL from INFERMESH_ROUTER_URL when
      # --router is not passed, so it always matches this service's addr.
      INFERMESH_ROUTER_URL: "http://router:8081"
      # Outbound relay URL. The router dials this in a retrying goroutine, so
      # an unresolvable hostname (relay service not up) just backlogs until it
      # comes online — harmless when the relay profile is not active.
      INFERMESH_RELAY_URL: "ws://relay:8090/v1/connect"
    restart: unless-stopped
    depends_on: []

  worker:
    image: ghcr.io/seppaleinen/infermesh/worker:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: worker
    container_name: infermesh-worker
    ports:
      - "8082:8082"
    command:
      # Worker flags. Default: dev mode, registers to the router over plain
      # HTTP inside the Compose network.
      #
      # --dev-mode is REQUIRED: the worker binary has no dev-mode default, so
      # without it the worker starts in prod mode and exits with
      # "--model-path is required in production mode".
      #
      # WORKER_MODEL_PATH is the path to your model file on the HOST. The
      # worker image needs a local inference backend (llama-cpp / ollama /
      # lmstudio / vllm) reachable from inside its container. For llama-cpp,
      # the default backend endpoint is localhost:8080 INSIDE the container,
      # so run the backend inside the worker container (or point
      # --backend-url at a reachable host:port). For ollama/lmstudio/vllm,
      # point --backend-url at the host-side backend (e.g.
      # --backend-url http://host.docker.internal:11434) since those run on
      # the host, not inside the container.
      - "--dev-mode"
      - "--backend"
      - "lmstudio"
      - "--backend-url"
      - "http://host.docker.internal:1234"
      - "--port"
      - "8082"
      - "--backend-timeout"
      - "120s"
    environment:
      # The worker resolves its router URL from INFERMESH_ROUTER_URL when
      # --router is not passed, so it always matches the router's addr.
      INFERMESH_ROUTER_URL: "http://router:8081"
    restart: unless-stopped
    depends_on:
      - router

  # ---------------------------------------------------------------------------
  # GPU worker (opt-in via `--profile gpu`).
  #
  # Requires the NVIDIA container runtime on the host. The worker container
  # gets access to all NVIDIA GPUs. The inference backend (llama-cpp / ollama
  # / vLLM) must be reachable from inside the container — either run it inside
  # the container (e.g. ollama in a sidecar) or point --backend-url at a
  # host-side backend (e.g. http://host.docker.internal:11434).
  #
  # Usage: docker compose --profile gpu up -d
  # ---------------------------------------------------------------------------
  worker-gpu:
    image: ghcr.io/seppaleinen/infermesh/worker:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: worker
    container_name: infermesh-worker-gpu
    ports:
      - "8082:8082"
    command:
      - "--dev-mode"
      - "--backend"
      - "ollama"
      - "--port"
      - "8082"
      - "--model-path"
      - "${WORKER_MODEL_PATH:-}"
      - "--max-tokens"
      - "${WORKER_MAX_TOKENS:-4096}"
    environment:
      INFERMESH_ROUTER_URL: "http://router:8081"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    depends_on:
      - router
    profiles:
      - gpu

  # ---------------------------------------------------------------------------
  # Relay broker (opt-in via `--profile relay`).
  #
  # The relay is a WebSocket broker that bridges workers and routers for
  # hosts that cannot accept inbound connections. Workers connect OUTBOUND
  # to the relay (no inbound port needed on the worker host). The router
  # also connects outbound to the relay. The relay routes messages between
  # them using the worker_id field in the message envelope.
  #
  # Workers on outbound-only hosts use:
  #   --relay-url ws://relay:8090/v1/connect
  # instead of --router http://router:8080.
  #
  # Usage: docker compose --profile relay up -d
  # ---------------------------------------------------------------------------
  relay:
    image: ghcr.io/seppaleinen/infermesh/relay:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.relay
    container_name: infermesh-relay
    ports:
      - "8090:8090"
    command:
      - "--dev-mode"
      - "--listen"
      - ":8090"
    restart: unless-stopped
    profiles:
      - relay

