# InferMesh — build-from-source Docker Compose flow.
#
# Builds every service from the local source tree instead of pulling
# pre-built images from ghcr.io. No GitHub access, no registry token, no
# pre-built image needed:
#
#   docker compose -f docker-compose.build.yml build
#   docker compose -f docker-compose.build.yml up -d
#
# GPU workers and the relay broker are opt-in via profiles (same profiles as
# docker-compose.yml). The relay is dev-mode only and profile-gated so it does
# NOT start by default.
#
# Override flags at runtime via ROUTER_ARGS / WORKER_ARGS / RELAY_ARGS (each
# image's CMD runs the binary with the corresponding env var).

services:
  router:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: router
    container_name: infermesh-router
    ports:
      - "8080:8080"
    command:
      - "--dev-mode"
    environment:
      # The worker resolves its router URL from INFERMESH_ROUTER_URL when
      # --router is not passed, so it always matches this service's addr.
      INFERMESH_ROUTER_URL: "http://router:8080"
      # Outbound relay URL (relay profile only). The router dials this in a
      # retrying goroutine, so an unresolvable hostname just backlogs until the
      # relay comes online — harmless when the relay profile is not active.
      INFERMESH_RELAY_URL: "ws://relay:8090/v1/connect"
      # Key the worker presents to the router during relay registration. The
      # router's --api-key gates client inference requests, but in relay mode
      # the worker is on a remote host with no peer IP to verify, so the
      # registration key IS the identity check — it must match the router's.
      INFERMESH_RELAY_API_KEY: "heybaby"
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: worker
    container_name: infermesh-worker
    ports:
      - "8081:8081"
    command:
      # --dev-mode is REQUIRED: the worker binary has no dev-mode default, so
      # without it the worker starts in prod mode and exits with
      # "--model-path is required in production mode".
      #
      # WORKER_MODEL_PATH is the path to your model file on the HOST. The
      # worker image needs a local inference backend reachable from inside its
      # container. For llama-cpp the default backend endpoint is
      # localhost:8080 INSIDE the container, so run the backend inside the
      # worker container (or point --backend-url at a reachable host:port).
      # For ollama/lmstudio/vllm, point --backend-url at the host-side backend
      # (e.g. --backend-url http://host.docker.internal:11434) since those
      # run on the host, not inside the container.
      - "--dev-mode"
      - "--backend"
      - "lmstudio"
      - "--model-path"
      - "${WORKER_MODEL_PATH:-}"
    environment:
      INFERMESH_ROUTER_URL: "http://router:8080"
      # Outbound relay URL. When the relay profile is active the worker
      # registers through the broker; if the broker is unreachable it falls
      # back to the direct HTTP registration above instead of spinning on a
      # dead socket (see relayReachable in pkg/worker/run.go).
      INFERMESH_RELAY_URL: "ws://relay:8090/v1/connect"
    restart: unless-stopped
    depends_on:
      - router

  # ---------------------------------------------------------------------------
  # GPU worker (opt-in via `--profile gpu`).
  #
  # Requires the NVIDIA container runtime on the host. The worker container
  # gets access to all NVIDIA GPUs. The inference backend (llama-cpp / ollama
  # / vLLM) must be reachable from inside the container — either run it inside
  # the container (e.g. ollama in a sidecar) or point --backend-url at a
  # host-side backend (e.g. http://host.docker.internal:11434).
  #
  # Usage: docker compose -f docker-compose.build.yml --profile gpu up -d
  # ---------------------------------------------------------------------------
  worker-gpu:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: worker
    container_name: infermesh-worker-gpu
    ports:
      - "8081:8081"
    command:
      - "--dev-mode"
      - "--backend"
      - "ollama"
      - "--model-path"
      - "${WORKER_MODEL_PATH:-}"
      - "--max-tokens"
      - "${WORKER_MAX_TOKENS:-4096}"
    environment:
      INFERMESH_ROUTER_URL: "http://router:8080"
      INFERMESH_RELAY_URL: "ws://relay:8090/v1/connect"
      INFERMESH_RELAY_API_KEY: "heybaby"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    depends_on:
      - router
    profiles:
      - gpu

  # ---------------------------------------------------------------------------
  # Relay broker (opt-in via `--profile relay`).
  #
  # The relay is a WebSocket broker that bridges workers and routers for hosts
  # that cannot accept inbound connections. Workers connect OUTBOUND to the
  # relay (no inbound port needed on the worker host). The router also
  # connects outbound to the relay. The relay routes messages between them
  # using the worker_id field in the message envelope.
  #
  # Workers on outbound-only hosts use:
  #   --relay-url ws://relay:8090/v1/connect
  # instead of --router http://router:8080.
  #
  # Usage: docker compose -f docker-compose.build.yml --profile relay up -d
  # ---------------------------------------------------------------------------
  relay:
    build:
      context: .
      dockerfile: docker/Dockerfile.relay
    container_name: infermesh-relay
    # No host port publish — see docker-compose.yml: the relay is an internal
    # broker reached via the Compose DNS name `relay:8090`, and publishing
    # 8090 to the host can collide with ssh and abort the whole profile.
    command:
      - "--dev-mode"
      - "--listen"
      - ":8090"
    restart: unless-stopped
    profiles:
      - relay