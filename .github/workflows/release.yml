name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.27'

      - name: Determine Next Version
        id: versioning
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.1.0")
          if [[ $LATEST_TAG =~ v([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            MAJOR=${BASH_REMATCH[1]}
            MINOR=${BASH_REMATCH[2]}
            PATCH=${BASH_REMATCH[3]}
          else
            MAJOR=0
            MINOR=1
            PATCH=0
          fi
          NEXT_PATCH=$((PATCH + 1))
          NEXT_TAG="v$MAJOR.$MINOR.$NEXT_PATCH"
          echo "next_tag=$NEXT_TAG" >> $GITHUB_OUTPUT
          echo "Next release tag: $NEXT_TAG"

      - name: Create Tag
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git tag ${{ steps.versioning.outputs.next_tag }}
          git push origin ${{ steps.versioning.outputs.next_tag }}

      - name: Build Static
        run: make build-static

      - name: Package and Checksum
        run: |
          mkdir -p dist
          cd bin
          for file in infermesh-*; do
            if [ -f "$file" ]; then
              tar -czf "$file.tar.gz" "$file"
              rm "$file"
            fi
          done
          cd ..
          cp bin/*.tar.gz dist/
          cd dist
          sha256sum *.tar.gz > SHA256SUMS.txt
          cd ..

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.next_tag }}
          files: dist/*.tar.gz dist/SHA256SUMS.txt
          generate_release_notes: true
