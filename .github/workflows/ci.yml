name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        # Pinned to 1.27.1 (NOT '1.27'): setup-go resolves '1.27' to the latest
        # 1.27.x (currently 1.27.2), whose stdlib emits export-data version 5.
        # Every golangci-lint release (v2.13.2 / v2.14.0) is built with
        # go1.27.0 and bundles x/tools that cap export-data at v4, so the lint
        # step fails with "export data version 5 is greater than maximum
        # supported version 4". 1.27.1 emits v4 and lints clean.
        # Bump this pin when a golangci-lint release lands with x/tools that
        # supports v5 — do NOT just re-open '1.27' or the job breaks again.
        go-version: '1.27.1'

    - name: Install dependencies
      run: go mod tidy

    - name: Run linting
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.13.2
        # v1.57.2 cannot run on Go ≥1.25 (export-data "unsupported version" /
        # bogus typecheck errors even on trivial modules); v2.13.2 is also
        # what `make lint` runs locally (see README Contributing).

    - name: Check formatting
      run: |
        if [ -n "$(gofmt -l .)" ]; then
          echo "gofmt violations found:"
          gofmt -l .
          exit 1
        fi

    - name: Run Go vet
      run: go vet ./...

    - name: Build binaries
      run: make build

    - name: Run tests
      run: go test ./... -v -cover -race