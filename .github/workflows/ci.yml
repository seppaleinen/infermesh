name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27'
    
    - name: Install dependencies
      run: go mod tidy
    
    - name: Run linting
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.13.2
        # v1.57.2 cannot run on Go ≥1.25 (export-data "unsupported version" /
        # bogus typecheck errors even on trivial modules); v2.13.2 is also
        # what `make lint` runs locally (see README Contributing).
        
    - name: Run Go vet
      run: go vet ./...
    
    - name: Build binaries
      run: make build
    
    - name: Run tests
      run: go test ./... -v -cover -race