name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        # Pinned to 1.27.1 (NOT '1.27'): setup-go resolves '1.27' to the latest
        # 1.27.x (currently 1.27.2), whose stdlib emits export-data version 5.
        # Every golangci-lint release (v2.13.2 / v2.14.0) is built with
        # go1.27.0 and bundles x/tools that cap export-data at v4, so the lint
        # step fails with "export data version 5 is greater than maximum
        # supported version 4". 1.27.1 emits v4 and lints clean.
        # Bump this pin when a golangci-lint release lands with x/tools that
        # supports v5 — do NOT just re-open '1.27' or the job breaks again.
        go-version: '1.27.1'

    - name: Install dependencies
      run: go mod tidy

    - name: Run linting
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.13.2
        # v1.57.2 cannot run on Go ≥1.25 (export-data "unsupported version" /
        # bogus typecheck errors even on trivial modules); v2.13.2 is also
        # what `make lint` runs locally (see README Contributing).

    - name: Check formatting
      run: |
        if [ -n "$(gofmt -l .)" ]; then
          echo "gofmt violations found:"
          gofmt -l .
          exit 1
        fi

    # Cross-reference contract docs against source. Catches stale claims
    # (CLI flags, file:line references, "no auth" scoping) that manual
    # review misses. Added after the #123/#128/#129 post-mortems found
    # docs/contracts drifting from code across four merged PRs.
    - name: Validate contract docs
      run: make validate-contracts

    - name: Run Go vet
      run: go vet ./...

    - name: Build binaries
      run: make build

    - name: Run tests
      run: go test ./... -v -cover -race

    - name: Check coverage threshold
      run: |
        make coverage
        TOTAL=$(go tool cover -func=cover/coverage.out | grep "^total:" | awk '{print $NF}' | tr -d '%')
        echo "Total pkg/ coverage: ${TOTAL}%"
        # Gate at 50%. The architectural review's critical risk paths
        # (GetWorkers side-effect, SetSupervisor cycle, circuit breaker,
        # router setters) are covered at 88-100%. Remaining gaps are
        # in lower-priority areas (platform detection, ws_client internals,
        # mDNS listener internals) that don't gate refactoring safety.
        if awk -v t="$TOTAL" 'BEGIN { exit (t < 50) ? 1 : 0 }'; then
          echo "Coverage ${TOTAL}% meets the 50% threshold"
        else
          echo "Coverage ${TOTAL}% is below the 50% threshold"
          exit 1
        fi

  # Type-check and build the Wails app frontend. The frontend is its own
  # Go-independent module; `npm run build` is `vue-tsc && vite build`, so this
  # single step gates both the type-check and the production bundle.
  app-frontend:
    name: App frontend type-check + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: app/frontend
        run: npm ci
      - name: Type-check and build frontend (vue-tsc && vite build)
        working-directory: app/frontend
        run: npm run build

  app-e2e:
    name: App E2E Playwright tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
    
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/frontend/package-lock.json
    
      - name: Install wails3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
    
      - name: Generate bindings (server tags)
        working-directory: app
        run: wails3 generate bindings -f '-tags=server' -clean=true -ts -i
    
      - name: Install frontend deps
        working-directory: app/frontend
        run: npm ci
    
      - name: Build frontend
        working-directory: app/frontend
        run: npm run build
    
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('app/frontend/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright
        working-directory: app/frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: app/frontend
        run: npx playwright test
        env:
          PLAYWRIGHT_TEMP_HOME: /tmp/infermesh-test-home

  # Fail if the committed Wails bindings drift from freshly generated output.
  # Ubuntu (not macOS) because the wails3 CLI is a pure-Go binary with no
  # webkit2gtk/GTK dependency; the trade-off is that CI does not compile the
  # full app (that is macOS/CGO only and verified locally on the primary
  # platform).
  app-bindings:
    name: App Wails bindings drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies for wails3 (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: app/go.sum
      - name: Install wails3 (pinned to Makefile WAILS3_VERSION)
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
      - name: Regenerate Wails bindings
        working-directory: app
        run: wails3 generate bindings -f '' -clean=true -ts -i
      - name: Fail if committed bindings drift from generator output
        run: |
          if [ -n "$(git status --porcelain -- app/frontend/bindings)" ]; then
            echo "::error::Committed Wails bindings are stale. Run 'cd app && wails3 generate bindings -f \"\" -clean=true -ts -i' locally and commit the result."
            git status --porcelain -- app/frontend/bindings
            git --no-pager diff -- app/frontend/bindings
            exit 1
          fi
          echo "Bindings match generator output."
