name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.0'
    
    - name: Install dependencies
      run: go mod tidy
    
    - name: Run linting
      uses: golangci/golangci-lint-action@v4
      with:
        version: v1.57.2
        
    - name: Run tests
      run: go test ./... -v -cover -race
    
    - name: Run Go vet
      run: go vet ./...
    
    - name: Build binary
      run: go build ./...