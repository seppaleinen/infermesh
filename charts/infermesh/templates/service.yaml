{{- $fullname := include "infermesh.fullname" . -}}
{{- $root := . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "infermesh.labels" $root | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "infermesh.routerSelectorLabels" $root | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.router.port | default 8080 }}
      targetPort: http
      protocol: TCP