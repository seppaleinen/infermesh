{{- if .Values.router -}}
{{- $root := . -}}
{{- $fullname := include "infermesh.fullname" . -}}
{{- $routerImage := include "infermesh.routerImage" . -}}
{{- $routerPort := int (.Values.router.port | default 8080) -}}
{{- $routerReplicas := int (.Values.router.replicas | default 1) -}}
{{- $mode := .Values.mode | default "dev" -}}
{{- $tlsEnabled := .Values.tls.enabled | default false -}}
{{- $secretName := .Values.tls.existingSecret | default "" -}}
{{- $routerArgs := list -}}
{{- $routerArgs = append $routerArgs (printf "--addr=:%d" $routerPort) -}}
{{- if eq $mode "prod" -}}
{{- $routerArgs = append $routerArgs "--prod-mode" -}}
{{- $routerArgs = append $routerArgs (printf "--mtls-cert=/certs/tls.crt") -}}
{{- $routerArgs = append $routerArgs (printf "--mtls-key=/certs/tls.key") -}}
{{- $routerArgs = append $routerArgs "--cert-dir=/certs" -}}
{{- else -}}
{{- $routerArgs = append $routerArgs "--dev-mode" -}}
{{- end -}}
{{- if .Values.router.modelAlias -}}
{{- $routerArgs = append $routerArgs (printf "--model-alias=%s" .Values.router.modelAlias) -}}
{{- end -}}
{{- if .Values.router.apiKey -}}
{{- $routerArgs = append $routerArgs (printf "--api-key=%s" .Values.router.apiKey) -}}
{{- end -}}
{{- range .Values.router.extraArgs -}}
{{- $routerArgs = append $routerArgs . -}}
{{- end -}}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-router
  labels:
    {{- include "infermesh.routerLabels" $root | nindent 4 }}
spec:
  replicas: {{ $routerReplicas }}
  selector:
    matchLabels:
      {{- include "infermesh.routerSelectorLabels" $root | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "infermesh.routerLabels" $root | nindent 8 }}
    spec:
      containers:
        - name: router
          image: {{ $routerImage | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" | quote }}
          args:
            {{- $routerArgs | toYaml | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ $routerPort }}
              protocol: TCP
          {{- if .Values.router.resources }}
          resources:
            {{- toYaml .Values.router.resources | nindent 12 }}
          {{- end }}
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          {{- if $tlsEnabled }}
          volumeMounts:
            - name: certs
              mountPath: /certs
              readOnly: true
          {{- end }}
      {{- if $tlsEnabled }}
      volumes:
        - name: certs
          secret:
            secretName: {{ if $secretName }}{{ $secretName | quote }}{{ else }}{{ printf "%s-tls" $fullname | quote }}{{ end }}
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
              - key: ca.crt
                path: ca.crt
            defaultMode: 0600
      {{- end }}
---
{{- end }}